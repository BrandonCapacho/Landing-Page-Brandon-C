<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Para Danika Jusara</title>
  <meta name="description" content="Una constelación de razones para quererte." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>💖</text></svg>" />
  <link rel="stylesheet" href="./css/styles.css" />

  <!-- El importmap debe ir ANTES de cualquier <script type="module">.
       La barra final de "three/addons/" es obligatoria en clave y valor. -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <canvas id="canvas" aria-label="Constelación interactiva de mensajes"></canvas>

  <!-- Encabezado -->
  <header id="encabezado">
    <p id="subtitulo"></p>
    <h1 id="titulo"></h1>
  </header>

  <!-- Pista de uso -->
  <p id="pista" aria-hidden="true"></p>

  <!-- Firma -->
  <p id="firma"></p>

  <!-- Panel del mensaje -->
  <div id="fondo-panel" hidden></div>
  <div id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-titulo" hidden tabindex="-1">
    <button id="panel-cerrar" type="button" aria-label="Cerrar">&times;</button>
    <h2 id="panel-titulo"></h2>
    <p id="panel-texto" aria-live="polite"></p>
  </div>

  <!-- Respaldo: sin WebGL, navegador viejo o CDN caído.
       La declaración se lee igual, solo que sin 3D. -->
  <section id="respaldo" hidden>
    <h1 id="respaldo-titulo"></h1>
    <ol id="respaldo-lista"></ol>
    <p id="respaldo-firma"></p>
  </section>

  <noscript>
    <div id="sin-js">
      <h1>Para Danika Jusara</h1>
      <p>Esta página necesita JavaScript para mostrarte la constelación.
        Pero lo importante cabe en una línea: <strong>te amo</strong>. — Brandon</p>
    </div>
  </noscript>

  <script type="module" src="./js/main.js"></script>

  <!-- Navegadores sin módulos ES ni importmap -->
  <script nomodule>
    document.getElementById('respaldo').hidden = false;
    document.getElementById('canvas').hidden = true;
    document.getElementById('respaldo-titulo').textContent = 'Para Danika Jusara';
    document.getElementById('respaldo-lista').innerHTML =
      '<li><strong>Te amo</strong>Tu navegador no puede mostrar la constelación, ' +
      'pero lo importante cabe en dos palabras.</li>';
    document.getElementById('respaldo-firma').textContent = 'Hecho a mano por Brandon';
  </script>
</body>

</html>
